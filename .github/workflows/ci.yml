# Проверка кода при каждом push в main
name: Проверка кода

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Проверка синтаксиса модулей
        run: |
          python -m py_compile launcher.py builds.py modrinth.py modrinth_ui.py mods_ui.py
          python -m py_compile java_manager.py java_download.py deps_check.py auto_backup.py
          python -c "from deps_check import require_dependencies; require_dependencies(offer_install=False); import launcher"
