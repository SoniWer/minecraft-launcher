# Сборка EXE и публикация в Releases (тег v*.*.*)
name: Релиз с EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.1.0)"
        required: true
        default: "1.7.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей и PyInstaller
        run: |
          pip install -r requirements.txt pyinstaller pillow

      - name: Discord credentials (Rich Presence)
        shell: pwsh
        run: |
          $id = "${{ secrets.DISCORD_APPLICATION_ID }}".Trim()
          if ($id) {
            Set-Content -Path discord_application_id.txt -Value $id -Encoding utf8NoBOM
            if (Test-Path discord_app.json) {
              $json = Get-Content discord_app.json -Raw | ConvertFrom-Json
              $json.application_id = $id
              $json | ConvertTo-Json -Compress | Set-Content discord_app.json -Encoding utf8NoBOM
            }
            Write-Host "Discord Application ID записан из секрета репозитория"
          } elseif (Test-Path discord_application_id.txt) {
            Write-Host "Используется discord_application_id.txt из репозитория"
          } else {
            Write-Host "Application ID не задан — кнопка Discord подключится после добавления ID в сборку"
          }

      - name: Создание иконки
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/make_icon.py

      - name: Сборка MinecraftLauncher.exe
        run: |
          python -m PyInstaller .github/MinecraftLauncher.spec --noconfirm --distpath . --workpath build

      - name: Проверка EXE и переименование с версией
        shell: pwsh
        run: |
          $exe = "MinecraftLauncher.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Файл $exe не найден в корне репозитория."
            Get-ChildItem -Recurse -Filter MinecraftLauncher.exe | Format-Table FullName, Length
            exit 1
          }
          $ver = python -c "from version import LAUNCHER_VERSION; print(LAUNCHER_VERSION)"
          $versioned = "MinecraftLauncher-v$ver.exe"
          Move-Item $exe $versioned -Force
          $size = (Get-Item $versioned).Length
          if ($size -lt 1MB) {
            Write-Error "Подозрительно маленький EXE: $size байт"
            exit 1
          }
          Write-Host "OK: $versioned ($([math]::Round($size/1MB, 2)) MB)"

      - name: Определение версии
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "exe=MinecraftLauncher-v${{ inputs.version }}.exe" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            V="${GITHUB_REF_NAME#v}"
            echo "exe=MinecraftLauncher-v${V}.exe" >> $GITHUB_OUTPUT
          fi

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Minecraft Launcher ${{ steps.ver.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: ${{ steps.ver.outputs.exe }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
