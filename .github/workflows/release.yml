# Сборка EXE и публикация в Releases (тег v*.*.*)
name: Релиз с EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей и PyInstaller
        run: |
          pip install -r requirements.txt pyinstaller pillow

      - name: Создание иконки
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/make_icon.py

      - name: Сборка MinecraftLauncher.exe
        run: |
          python -m PyInstaller .github/MinecraftLauncher.spec --noconfirm --distpath . --workpath build

      - name: Проверка EXE перед релизом
        shell: pwsh
        run: |
          $exe = "MinecraftLauncher.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Файл $exe не найден в корне репозитория."
            Write-Host "Поиск EXE на диске:"
            Get-ChildItem -Recurse -Filter MinecraftLauncher.exe | Format-Table FullName, Length
            exit 1
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) {
            Write-Error "Подозрительно маленький EXE: $size байт"
            exit 1
          }
          Write-Host "OK: $exe ($([math]::Round($size/1MB, 2)) MB)"

      - name: Определение версии
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Minecraft Launcher ${{ steps.ver.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: MinecraftLauncher.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
